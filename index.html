   <section id="player" class="w-full bg-[#321016] px-5 py-16 md:px-8">
    <div class="mx-auto max-w-6xl">
     <div class="mb-9 text-center">
       <p data-template-id="player-kicker" class="canva-text text-xs font-bold uppercase tracking-[.3em]">Now threading</p>
       <h2 data-template-id="player-title" class="canva-text display mt-3 font-bold text-3xl">The Listening Deck</h2>
      </div>
     <div class="paper-panel rounded-xl p-4 md:p-7">
      <div class="grid gap-7 lg:grid-cols-[.78fr_1.22fr]">
       <div id="playerCassette" class="cassette self-center">
        <div class="reel left"><span></span></div>
        <div class="reel right"><span></span></div>
        <div class="absolute bottom-[10%] left-[24%] right-[24%] h-5 rounded-sm bg-[#321312]"></div>
       </div>
       <div class="flex min-w-0 flex-col justify-center">
        <p data-template-id="now-playing-label" class="canva-text text-xs font-bold uppercase tracking-[.25em]"></p>
        <h3 id="songTitle" class="display mt-2 text-3xl font-bold leading-tight md:text-4xl">Loading tape…</h3>
        <p id="songArtist" class="mt-2 text-base font-semibold text-[#7a3624]">MusicPlays</p>
        <p id="songAlbum" class="mt-1 text-sm text-[#5f4632]">Tonight’s Mixtape</p>
        <div class="mt-6 flex items-center gap-3">
         <div id="visualizer" class="equalizer" aria-label="Audio visualizer" role="img">
          <span style="height:12px"></span><span style="height:22px"></span><span style="height:15px"></span><span style="height:25px"></span><span style="height:18px"></span><span style="height:10px"></span><span style="height:20px"></span>
         </div><span id="playState" class="text-xs font-bold uppercase tracking-[.18em] text-[#873324]">Paused</span>
        </div>
        <div class="mt-5 flex items-center gap-3 text-xs font-bold tabular-nums text-[#633023]">
         <span id="currentTime">0:00</span> <label class="sr-only" for="progressBar">Song progress</label> <input id="progressBar" class="w-full" type="range" min="0" max="100" value="0" step="0.1"> <span id="durationTime">0:00</span>
        </div>
        <div class="mt-7 flex items-center justify-center gap-3">
         <button id="shuffleBtn" class="control" type="button" aria-label="Toggle shuffle"><i data-lucide="shuffle" width="19"></i></button> <button id="previousBtn" class="control" type="button" aria-label="Previous song"><i data-lucide="skip-back" width="20"></i></button> <button id="playBtn" class="control primary" type="button" aria-label="Play or pause"><i id="playIcon" data-lucide="play" width="27"></i></button> <button id="nextBtn" class="control" type="button" aria-label="Next song"><i data-lucide="skip-forward" width="20"></i></button> <button id="repeatBtn" class="control" type="button" aria-label="Repeat mode off"><i id="repeatIcon" data-lucide="repeat" width="19"></i></button>
        </div>
        <div class="mt-6 flex items-center justify-center gap-3">
         <button id="muteBtn" class="rounded p-2 text-[#693220] hover:bg-[#d9b97888] focus:outline-none focus:ring-2 focus:ring-[#8b3221]" type="button" aria-label="Mute volume"><i id="muteIcon" data-lucide="volume-2" width="19"></i></button> <label class="sr-only" for="volumeBar">Volume</label> <input id="volumeBar" class="w-40 max-w-[55vw]" type="range" min="0" max="100" value="100"> <span id="volumeText" class="w-9 text-xs font-bold text-[#693220]">100%</span>
        </div>
       </div>
      </div>

    </div>
   </section>
